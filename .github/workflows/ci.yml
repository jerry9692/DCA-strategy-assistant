name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Default to least-privilege: GITHUB_TOKEN should only need to read
# the repo for checkout / coverage upload. If a job later needs
# `contents: write` (e.g. to push a generated commit), it should
# override this with its own `permissions:` block.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # pip install + pytest with coverage on a clean checkout is
    # normally 4-5 minutes. The 12-minute cap matches the frontend
    # job and leaves headroom for pip registry hiccups.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Run tests
        run: pytest backend/tests -q --cov=app --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: backend

      # Upload the coverage XML so reviewers can download and inspect
      # it from the Actions run page. Uses the official
      # actions/upload-artifact@v4 and is non-blocking (if: always())
      # so an upload failure doesn't fail the build.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      # Re-export the OpenAPI schema and fail if the committed copy is
      # out of date. Forces every backend model change to land alongside
      # a refreshed openapi.json (and, by extension, regenerated frontend
      # types — the frontend job below regenerates and diffs those).
      - name: OpenAPI schema is up to date
        working-directory: backend
        run: |
          python export_openapi.py
          git diff --exit-code openapi.json

      # Non-blocking dependency vulnerability scan. Surfaces known CVEs
      # in the PR logs without failing the build — see roadmap Q7. Kept
      # out of the blocking path so a fresh advisory can't stall a PR
      # while we triage it.
      - name: Security audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    # Vitest + typecheck on a clean `npm ci` is normally under 3
    # minutes; the 12-minute cap matches the backend job and leaves
    # room for npm registry hiccups.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest
        working-directory: frontend
        run: npx vitest run

      - name: ESLint
        working-directory: frontend
        run: npx eslint src

      # Regenerate the API types from the committed openapi.json (which
      # the backend job already verified is up to date) and fail if the
      # checked-in api.generated.ts has drifted. Closes the loop on B4:
      # a backend model change can no longer slip through without the
      # frontend types catching up.
      - name: Generated API types are up to date
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code src/api.generated.ts

      # Non-blocking dependency vulnerability scan. Mirrors the backend
      # pip-audit step; continue-on-error so a new advisory shows up in
      # the PR logs without blocking merges (roadmap Q7).
      - name: Security audit (non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev
